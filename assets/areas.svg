<svg xmlns="http://www.w3.org/2000/svg" width="960" height="496" viewBox="0 0 960 496" role="img" aria-labelledby="t d"><title id="t">What I build</title><desc id="d">AI agents: Claude Code systems, agent skills and MCP servers: assistants that answer from real data and stay read-only unless a person says otherwise. Tools: Claude Code · MCP · Agent Skills · smolagents. Business intelligence: Power BI semantic models, DAX and SQL. Reports that refresh themselves, alerts on stale data, 735 measures documented across five models. Tools: Power BI · DAX · SQL · Python · GitHub Actions. Process automation: Playwright bots, Electron apps and POS integrations. Bulk changes run behind a plan that a person reads and approves. Tools: Playwright · Electron · TypeScript · Node.js. Web products: Sites and apps for clients through my own B2B company, from booking systems to fast static sites with their own admin panels. Tools: Next.js · React · Supabase · Postgres · Astro · PHP. Foundations: From university: algorithms in C and C++, x86 Assembly down to IEEE-754 addition, agent-based simulation in NetLogo, Bash, C#. Tools: C · C++ · Assembly · C# · NetLogo · Bash.</desc><style>@font-face{font-family:IS;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;src:url(data:font/woff2;base64,) format('woff2')}</style><rect width="960" height="496" rx="14" fill="#0E141B"/><rect x="0.5" y="0.5" width="959" height="495" rx="13.5" fill="none" stroke="#2D3B47"/><text x="32.0" y="40.0" font-family="IS" font-size="30" fill="#E6EBF0">AI agents</text><text x="32.0" y="72.0" font-family="JBM" font-size="13" fill="#E6EBF0">Claude Code systems, agent skills and MCP servers:</text><text x="32.0" y="92.0" font-family="JBM" font-size="13" fill="#E6EBF0">assistants that answer from real data and stay</text><text x="32.0" y="112.0" font-family="JBM" font-size="13" fill="#E6EBF0">read-only unless a person says otherwise.</text><text x="32.0" y="144.0" font-family="JBM" font-size="12